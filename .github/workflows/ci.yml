name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build and Lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build root crate
        run: cargo build --release

      - name: Build teleport crate
        run: cd teleport && cargo build --release

      - name: Run tests
        run: cargo test --release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iracing-teleport
          path: |
            target/release/iracing-teleport.exe
            teleport/target/release/source.exe
            teleport/target/release/target.exe
            teleport/target/release/teleport.exe
          retention-days: 7

  release:
    name: Publish Release
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build root crate
        run: cargo build --release

      - name: Build teleport crate
        run: cd teleport && cargo build --release

      - name: Create release and upload exes
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/iracing-teleport.exe
            teleport/target/release/source.exe
            teleport/target/release/target.exe
            teleport/target/release/teleport.exe
          generate_release_notes: true
